# Статическая сборка сайта «СТАЛЬ»
# При каждом пуше в main собирает чистую статику и публикует её в ветку `static`.
# Ветку `static` подключает Timeweb App Platform (preset HTML/CSS/JS, каталог /).
# Vercel продолжает собирать main — два деплоя не мешают друг другу.
name: Static build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build static export
        run: bun run build:static

      - name: Publish to `static` branch
        run: |
          cd out
          git init -q -b static
          git config user.name "static-bot"
          git config user.email "static-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "static build of ${GITHUB_SHA:0:7}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -q -f origin static
